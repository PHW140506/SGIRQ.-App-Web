<div class="shell">
  <aside class="sidebar">
    <div class="logo"><img src="/logo-sgirq.jpeg" alt="Logo SGIRQ"><strong>SGIRQ</strong></div>
    <nav aria-label="Navegación principal">
      <a routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a routerLink="/inventario" routerLinkActive="active"><i class="bi bi-box-seam"></i> Inventario</a>
      @if (auth.isAdmin()) { <a routerLink="/entradas" routerLinkActive="active"><i class="bi bi-box-arrow-in-down"></i> Entradas</a> }
      <a routerLink="/salidas" routerLinkActive="active"><i class="bi bi-box-arrow-up"></i> Salidas</a>
      <a routerLink="/solicitudes" routerLinkActive="active"><i class="bi bi-clipboard-check"></i> Solicitudes</a>
      @if (auth.isAdmin()) {
        <a routerLink="/reportes" routerLinkActive="active"><i class="bi bi-file-earmark-pdf"></i> Reportes</a>
        <a routerLink="/trazabilidad" routerLinkActive="active"><i class="bi bi-clock-history"></i> Trazabilidad</a>
        <a routerLink="/personal" routerLinkActive="active"><i class="bi bi-people"></i> Personal</a>
      }
    </nav>
    <div class="sidebar-footer">
      <a routerLink="/cuenta" routerLinkActive="active"><i class="bi bi-person-circle"></i> Mi cuenta</a>
      <button type="button" class="nav-button" (click)="auth.logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar"><span>Sistema de Gestión de Inventario de Reactivos Químicos</span>
      <span>{{ auth.session()?.nombre }} · {{ auth.session()?.rol }}</span></header>
    <main class="page"><router-outlet /></main>
  </div>
</div>
