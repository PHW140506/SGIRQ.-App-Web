<div class="min-h-screen bg-[#f4f6f8] flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-[400px] rounded-2xl shadow-lg border border-slate-200 p-8 text-center relative">

    <!-- Logotipo Matraz Isométrico Oficial -->
    <div class="w-24 h-24 mx-auto mb-3 flex items-center justify-center">
      <svg viewBox="0 0 100 100" class="w-20 h-20">
        <path d="M38 15 H62 M43 15 V35 L22 65 L50 82 L78 65 L57 35 V15" fill="none" stroke="#0f5132" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 65 L50 50 L78 65 L50 82 Z" fill="#198754"/>
        <path d="M22 65 V80 L50 95 V82 Z" fill="#0f5132"/>
        <path d="M78 65 V80 L50 95 V82 Z" fill="#157347"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-[#0f5132]">Iniciar sesión</h1>
    <p class="text-xs text-slate-500 mt-1 mb-6">Accede a tu cuenta para continuar</p>

    <form (ngSubmit)="onSubmit()" novalidate class="text-left space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Usuario</label>
        <div class="relative">
          <input
            type="text"
            name="identificador"
            [(ngModel)]="identificador"
            placeholder="Ingresa tu usuario"
            class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:border-[#157347] bg-slate-50/50" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            class="w-full pl-3 pr-9 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:border-[#157347] bg-slate-50/50" />
          <button type="button" (click)="togglePassword()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
            <span class="text-xs">{{ showPassword ? 'Ocultar' : 'Ver' }}</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-1.5 text-slate-600 cursor-pointer">
          <input type="checkbox" name="recordarme" [(ngModel)]="recordarme" class="rounded text-[#157347]" />
          <span>Recordarme</span>
        </label>
        <a href="javascript:void(0)" class="text-[#157347] hover:underline font-medium">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="w-full bg-[#157347] hover:bg-[#0f5132] text-white font-semibold py-2.5 rounded-lg shadow-sm transition text-sm mt-2">
        Iniciar sesión
      </button>
    </form>
  </div>

  <!-- Modal Oficial "Datos incorrectos" (Página 2 del PDF) -->
  <div *ngIf="showErrorModal" class="fixed inset-0 bg-black/45 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
      <div class="w-14 h-14 rounded-full bg-emerald-50 border-2 border-[#0f5132] text-[#0f5132] flex items-center justify-center mx-auto mb-3 text-2xl font-serif italic font-bold">
        i
      </div>
      <h3 class="text-xl font-bold text-[#0f5132]">{{ modalTitle }}</h3>
      <p class="text-xs text-slate-600 mt-2 leading-relaxed whitespace-pre-line">{{ modalMessage }}</p>
      <div class="flex items-center justify-center gap-3 mt-6">
        <button (click)="closeModal()" class="flex-1 bg-[#157347] hover:bg-[#0f5132] text-white text-xs font-semibold py-2.5 rounded-lg">
          Reintentar
        </button>
        <button (click)="closeModal()" class="flex-1 bg-[#dc2626] hover:bg-rose-700 text-white text-xs font-semibold py-2.5 rounded-lg">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
